appId: com.backuphub.app
productName: BackupHub
copyright: Copyright © BackupHub
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,version.readme}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,vitest.config.mts}'
  - '!tests/*'
  - '!.cursor/*'
  - '!driver-mirror/**'
  - '!drizzle/**'
asarUnpack:
  - resources/**
  - '**/*.node'
extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - '**/*'
win:
  executableName: BackupHub
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: BackupHub needs access to Documents to store and restore backups.
    - NSDownloadsFolderUsageDescription: BackupHub needs access to Downloads for backup targets.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: BackupHub
  category: Utility
  syncDesktopName: true
  synopsis: Scheduled backups for databases, S3, and server files
  description: BackupHub manages scheduled backups of databases, AWS S3 objects, and remote server files.
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: true
electronLanguages:
  - en
publish: null
